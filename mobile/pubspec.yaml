name: calcar
description: Calcar thin control client. Render only, no AI run, no provider logic.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cryptography: ^2.7.0
  crypto: ^3.0.3
  flutter_riverpod: ^2.5.1
  flutter_secure_storage: ^9.2.2
  http: ^1.2.2
  local_auth: ^2.3.0
  open_filex: ^4.7.0
  package_info_plus: ^9.0.1
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0
  protobuf: ^6.1.0
  fixnum: ^1.1.1
  web_socket_channel: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.png"
  adaptive_icon_background: "#111111"
