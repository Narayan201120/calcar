[workspace]
resolver = "2"
members = [
    "crates/calcar-events",
    "crates/calcar-storage",
    "crates/calcar-pty",
    "crates/calcar-agent",
    "crates/calcar-workflow",
    "crates/calcar-adapters",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "UNLICENSED"

[workspace.dependencies]
calcar-adapters = { path = "crates/calcar-adapters" }
calcar-events = { path = "crates/calcar-events" }
calcar-storage = { path = "crates/calcar-storage" }
calcar-pty = { path = "crates/calcar-pty" }
calcar-workflow = { path = "crates/calcar-workflow" }
thiserror = "2"

[profile.release]
lto = "thin"
