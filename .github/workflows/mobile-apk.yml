name: mobile-apk
on:
  push:
    paths:
      - 'mobile/**'
      - 'proto/**'
      - '.github/workflows/mobile-apk.yml'
  workflow_dispatch:
    inputs:
      backend_url:
        description: 'Backend base URL the phone calls'
        required: false
        default: ''
      agent_url:
        description: 'Agent base URL on the private mesh'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter --version
      - run: yes | flutter doctor --android-licenses
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Scaffold Android platform
        run: |
          set -euo pipefail
          flutter create --platforms=android --org dev.calcar --project-name calcar /tmp/plat
          cp -r /tmp/plat/android ./android
          rm -rf /tmp/plat
          test -f android/app/build.gradle -o -f android/app/build.gradle.kts
          # local_auth needs a FragmentActivity. The default template uses
          # FlutterActivity, which makes every authenticate call fail
          # immediately with no OS prompt. Patch the scaffold every build.
          ACT=$(find android/app/src/main -name MainActivity.kt -o -name MainActivity.java | head -n 1)
          sed -i 's/import io.flutter.embedding.android.FlutterActivity/import io.flutter.embedding.android.FlutterFragmentActivity/' "$ACT"
          sed -i 's/: FlutterActivity()/: FlutterFragmentActivity()/' "$ACT"
          sed -i 's/extends FlutterActivity/extends FlutterFragmentActivity/' "$ACT"
          grep -q FlutterFragmentActivity "$ACT"
          MAN=android/app/src/main/AndroidManifest.xml
          grep -q USE_BIOMETRIC "$MAN" || sed -i '/<application/ i \    <uses-permission android:name="android.permission.USE_BIOMETRIC"\/>' "$MAN"
          # The manual updater hands a verified APK to the OS installer.
          # open_filex removed REQUEST_INSTALL_PACKAGES for Play policy;
          # this dev updater needs it declared to open the installer sheet.
          grep -q REQUEST_INSTALL_PACKAGES "$MAN" || sed -i '/<application/ i \    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"\/>' "$MAN"
          cat "$ACT"
      - name: Generate launcher icons
        run: |
          set -euo pipefail
          # android/ is a fresh scaffold, so icons generate every build
          # from the committed logo. Needs pub get first, done above.
          dart run flutter_launcher_icons
      - name: Pin shared debug signing identity
        run: |
          set -euo pipefail
          # Every CI runner generates its own debug.keystore on first use,
          # which would give each build a different signing identity and
          # make Android refuse updates as incompatible. Copy the committed
          # dev key so all CI APKs share one identity. This key is
          # development only and public by design.
          # The Gradle and SDK tools resolve the debug keystore through
          # several candidate homes, and GitHub runners set
          # ANDROID_SDK_HOME, so one copy is not enough: plant ours at
          # every candidate and pin ANDROID_USER_HOME for later steps.
          test -f debug.keystore
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
          chmod 600 ~/.android/debug.keystore
          if [ -n "${ANDROID_SDK_HOME:-}" ]; then
            mkdir -p "$ANDROID_SDK_HOME/.android"
            cp debug.keystore "$ANDROID_SDK_HOME/.android/debug.keystore"
          fi
          if [ -n "${ANDROID_USER_HOME:-}" ]; then
            mkdir -p "$ANDROID_USER_HOME"
            cp debug.keystore "$ANDROID_USER_HOME/debug.keystore"
          fi
          echo "ANDROID_USER_HOME=$HOME/.android" >> "$GITHUB_ENV"
      - name: Build debug APK
        run: |
          set -euo pipefail
          BACKEND="${{ inputs.backend_url }}${{ vars.CALCAR_BACKEND_URL }}"
          AGENT="${{ inputs.agent_url }}${{ vars.CALCAR_AGENT_URL }}"
          ARGS="--debug --build-number=${{ github.run_number }}"
          if [ -n "$BACKEND" ]; then ARGS="$ARGS --dart-define=CALCAR_BACKEND_URL=$BACKEND"; fi
          if [ -n "$AGENT" ]; then ARGS="$ARGS --dart-define=CALCAR_AGENT_URL=$AGENT"; fi
          # shellcheck disable=SC2086
          flutter build apk $ARGS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BACKEND="${{ inputs.backend_url }}${{ vars.CALCAR_BACKEND_URL }}"
          if [ -z "$BACKEND" ]; then
            echo "no backend_url: artifact only, no release, so the updater never serves a localhost build"
            exit 0
          fi
          RUN="${{ github.run_number }}"
          TAG="mobile-${RUN}"
          APK="build/app/outputs/flutter-apk/app-debug.apk"
          test -f "$APK"
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists: never overwriting"
            exit 0
          fi
          export REPO="${{ github.repository }}" RUN SHA
          python3 - <<'EOF'
          import json
          import os
          import subprocess
          import urllib.request
          repo = os.environ["REPO"]
          run = int(os.environ["RUN"])
          sha = os.environ["SHA"]
          version_name = "0.1.0+" + str(run)
          apk_url = (
              "https://github.com/" + repo +
              "/releases/download/mobile-" + str(run) + "/calcar.apk"
          )
          out = subprocess.run(
              ["gh", "api", "repos/" + repo + "/releases?per_page=100"],
              capture_output=True, text=True, check=True,
          )
          releases = json.loads(out.stdout)
          prev = 0
          for item in releases:
              tag = item.get("tag_name", "")
              if tag.startswith("mobile-") and tag[7:].isdigit():
                  num = int(tag[7:])
                  if num < run and num > prev:
                      prev = num
          previous = None
          if prev > 0:
              prev_url = (
                  "https://github.com/" + repo +
                  "/releases/download/mobile-" + str(prev) + "/update.json"
              )
              try:
                  with urllib.request.urlopen(prev_url, timeout=30) as resp:
                      prev_manifest = json.loads(resp.read().decode("utf-8"))
                  prev_latest = prev_manifest["latest"]
                  previous = {
                      "versionCode": int(prev_latest["versionCode"]),
                      "versionName": str(prev_latest["versionName"]),
                      "apkUrl": str(prev_latest["apkUrl"]),
                      "sha256": str(prev_latest["sha256"]),
                  }
              except Exception as exc:
                  print("warning: previous update.json unreadable: " + str(exc))
                  previous = None
          manifest = {
              "latest": {
                  "versionCode": run,
                  "versionName": version_name,
                  "apkUrl": apk_url,
                  "sha256": sha,
              },
              "previous": previous,
          }
          with open("/tmp/update.json", "w", encoding="utf-8") as handle:
              json.dump(manifest, handle, indent=2)
              handle.write("\n")
          print("previous run: " + (str(prev) if prev > 0 else "none"))
          EOF
          cp "$APK" /tmp/calcar.apk
          BT=$(echo "$ANDROID_HOME/build-tools/"*/apksigner | tr ' ' '\n' | sort | tail -n 1)
          if [ -x "$BT" ]; then
            "$BT" verify --print-certs /tmp/calcar.apk | head -n 4 || true
          fi
          # Signing gate: the APK must carry the shared dev identity, or
          # Android will refuse it as an update. Fail loudly instead of
          # publishing an uninstallable release. apksigner print formats
          # vary by version, so both sides compare colonless lowercase.
          EXPECTED="3b1c126e40d2d78b2ce6e88bcec4559a4f13d340a8d5b2ed941f45df4bf0d8b4"
          if [ -x "$BT" ]; then
            ACTUAL=$("$BT" verify --print-certs /tmp/calcar.apk | grep -i 'SHA-256 digest' | grep -oiE '[0-9a-f:]{32,}' | head -n 1 | tr -d ':' | tr 'A-Z' 'a-z' || true)
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "signing identity mismatch: got ${ACTUAL:-none}, want $EXPECTED"
              exit 1
            fi
          fi
          gh release create "$TAG" /tmp/calcar.apk /tmp/update.json \
            --title "Calcar mobile-${RUN}" \
            --notes "Dev debug build versionCode ${RUN}, SHA-256 ${SHA}. Same shared debug signing identity as all CI builds."
      - uses: actions/upload-artifact@v4
        with:
          name: calcar-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
