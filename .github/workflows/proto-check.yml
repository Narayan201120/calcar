name: proto-check

on:
  push:
  pull_request:

jobs:
  proto-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for breaking check)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up buf
        uses: bufbuild/buf-setup-action@v1

      - name: Buf lint
        run: buf lint proto/

      - name: Buf breaking (against main, PRs only)
        if: github.event_name == 'pull_request'
        run: buf breaking proto/ --against '.git#branch=origin/main'

      - name: Buf generate check (owned by backend-check)
        run: echo "Generate freshness is enforced in backend-check; skipping here."

      - name: Envelope contract check
        run: python3 scripts/check-proto.py
